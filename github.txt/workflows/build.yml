name: Build BHAIYU APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional: repo Settings > Secrets and variables > Actions > OPENAI_KEY and/or GEMINI_KEY
      - name: Inject API keys (optional)
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          F=app/src/main/assets/BHAIYU_Brain.html
          if [ -n "$OPENAI_KEY" ]; then sed -i "s|PASTE-YOUR-OPENAI-KEY-HERE|$OPENAI_KEY|" $F; fi
          if [ -n "$GEMINI_KEY" ]; then sed -i "s|PASTE-YOUR-GEMINI-KEY-HERE|$GEMINI_KEY|" $F; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BHAIYU-apk
          path: app/build/outputs/apk/debug/app-debug.apk
